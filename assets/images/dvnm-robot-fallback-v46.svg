 <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#173847"/><stop offset="1" stop-color="#061a28"/></linearGradient>
 <filter id="glow" x="-35%" y="-35%" width="170%" height="170%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <style>.blink-lid{opacity:0;transform-box:fill-box;transform-origin:center;animation:v55-eye-blink 5.4s ease-in-out infinite}.blink-lid.right{animation-delay:.07s}@keyframes v55-eye-blink{0%,89%,92%,100%{opacity:0;transform:scaleY(.04)}90%,91%{opacity:1;transform:scaleY(1)}}@media(prefers-reduced-motion:reduce){.blink-lid{animation:none;opacity:0}}</style>
</defs>
