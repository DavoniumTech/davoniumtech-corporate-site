<svg xmlns="http://www.w3.org/2000/svg" width="520" height="620" viewBox="0 0 520 620" role="img" aria-labelledby="title desc">
<title id="title">DVNM Bot</title><desc id="desc">A small friendly white robot with aqua eyes and a glowing DVNM chest light.</desc>
<defs>
