<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Davonium Admin Lead Desk</title>
<style>
:root{color-scheme:dark}body{margin:0;background:#081323;color:#e9f2ff;font:16px system-ui}main{max-width:1100px;margin:auto;padding:20px}.card{background:#122239;border:1px solid #2c4564;border-radius:15px;padding:18px;margin:12px 0}input,select,textarea{display:block;box-sizing:border-box;width:100%;padding:11px;margin:8px 0;background:#071426;color:#fff;border:1px solid #3b5571;border-radius:8px;font:inherit}button{padding:10px 13px;border:1px solid #5578a0;background:#1f3e5f;color:white;border-radius:9px;cursor:pointer}button.primary{background:#b6d7ff;color:#071426;font-weight:bold}.hidden{display:none}.grid{display:grid;grid-template-columns:1fr 1.6fr;gap:14px}.lead{padding:12px;border-bottom:1px solid #30455c}.msg{color:#a8c9f0;min-height:1.3em;overflow-wrap:anywhere}.diag{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;color:#c8ddf5;background:#071426;padding:12px;border-radius:9px}.actions{display:flex;flex-wrap:wrap;gap:8px}@media(max-width:700px){main{padding:12px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<header class="card"><strong>DAVONIUM TECHNOLOGIES</strong><p>Internal lead desk · Private staff access</p><button id="logout" class="hidden">Sign out</button></header>
<section id="login" class="card">
<h1>Staff sign in</h1>
<form id="login-form"><label>Email<input id="email" type="email" required autocomplete="username"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><div class="actions"><button class="primary" type="submit">Sign in</button><button id="test-connection" type="button">Test backend connection</button></div><p id="login-msg" class="msg" role="status" aria-live="polite"></p><div id="diagnostic" class="diag" hidden></div></form>
</section>
<section id="dash" class="hidden">
<section class="card"><h1>Enquiry pipeline</h1><p id="staff-role"></p><div class="actions"><button id="refresh">Refresh</button><button id="projects">View projects</button></div><p id="dash-msg" class="msg" role="status"></p></section>
<div class="grid"><section class="card" id="list">Loading leads…</section><section class="card" id="detail">Choose a lead.</section></div>
<section class="card"><h2>Notifications</h2><div id="notifications"></div></section>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" referrerpolicy="no-referrer"></script>
<script src="/assets/js/davonium-v69-backend-config.js?v=69.3.20261126"></script>
<script src="/assets/js/davonium-v69-admin.js?v=69.3.20261126"></script>
</body></html>
