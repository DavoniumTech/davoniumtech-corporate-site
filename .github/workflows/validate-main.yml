name: Validate Davonium static website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check changed JavaScript syntax
        run: |
          node --check assets/js/davonium-v68-workspaces-premium.js
          node --check sw.js
          node --check assets/js/davonium-v71-knowledge-centre.js

      - name: Check release assets and route families
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path(".")
          required = [
              "index.html",
              "about.html",
              "services.html",
              "products.html",
              "pricing.html",
              "work.html",
              "business-launch-kit.html",
              "contact.html",
              "support.html",
              "project-builder.html",
              "install.html",
              "assets/css/davonium-v71-site.css",
              "assets/js/davonium-v68-workspaces-premium.js",
              "sw.js",
              "knowledge-centre.html",
              "insights.html",
          ]
          missing = [item for item in required if not (root / item).is_file()]
          if missing:
              raise SystemExit("Missing required release files: " + ", ".join(missing))

          demos = ["business", "shop", "portfolio", "learning", "technology", "marketing", "community", "certificate"]
          workspaces = ["biz", "market", "creative", "skills", "digital"]
          for item in demos:
              if not (root / "demos" / (item + ".html")).is_file():
                  raise SystemExit("Missing demo route: " + item)
          for item in workspaces:
              if not (root / "workspaces" / (item + ".html")).is_file():
                  raise SystemExit("Missing Forge workspace route: " + item)

          forge = (root / "assets/js/davonium-v68-workspaces-premium.js").read_text(encoding="utf-8")
          for marker in ["localStorage.setItem(storageKey", "indexedDB.open", "function undoChange", "function redoChange", "function exportWorkspaceJson", "function importWorkspaceJson", "function zipBytes", "Built with DVNM Forge by Davonium Technologies"]:
              if marker not in forge:
                  raise SystemExit("DVNM Forge implementation marker missing: " + marker)

          css = (root / "assets/css/davonium-v68-premium-system.css").read_text(encoding="utf-8")
          sw = (root / "sw.js").read_text(encoding="utf-8")
          if "davonium-v71-site.css" not in css:
              raise SystemExit("V71 shared CSS import is missing")
          if "davonium-v71-site.css" not in sw or "davonium-site-v71-content-20261127-r2" not in sw:
              raise SystemExit("V71 service-worker cache refresh is missing")

          # Confirm new editorial pages are substantial and included in search discovery.
          knowledge = (root / "knowledge-centre.html").read_text(encoding="utf-8")
          insights = (root / "insights.html").read_text(encoding="utf-8")
          sitemap = (root / "sitemap.xml").read_text(encoding="utf-8")
          if knowledge.count("<dt>") != 220:
              raise SystemExit("Knowledge Centre must contain exactly 220 static glossary terms.")
          if insights.count('class="section insight-article"') != 6:
              raise SystemExit("Insights page must contain the six initial editorial articles.")
          for url in ["https://www.davoniumtech.com/knowledge-centre", "https://www.davoniumtech.com/insights"]:
              if url not in sitemap:
                  raise SystemExit("New public route is missing from sitemap: " + url)

          # Ensure resource links are reachable from all page families that use shared navigation.
          check_pages = [
              "index.html", "about.html", "services.html", "products.html", "pricing.html",
              "work.html", "business-launch-kit.html", "contact.html", "support.html",
              "project-builder.html", "install.html", "docs/index.html", "demos/index.html",
              "workspaces/index.html", "legal/privacy.html", "legal/cookies.html", "legal/terms.html",
          ]
          check_pages += [str(p) for p in (root / "docs/guides").glob("*.html")]
          check_pages += [str(p) for p in (root / "demos").glob("*.html") if p.name != "preview.html"]
          check_pages += [str(p) for p in (root / "workspaces").glob("*.html") if p.name != "index.html"]
          missing_navigation = []
          for name in check_pages:
              page = (root / name).read_text(encoding="utf-8")
              if 'id="primary-nav"' in page or 'class="dvnm-demo-nav"' in page or 'class="v68-demo-nav"' in page:
                  if 'href="/insights"' not in page or 'href="/knowledge-centre"' not in page:
                      missing_navigation.append(name)
          if missing_navigation:
              raise SystemExit("Resource navigation missing from: " + ", ".join(missing_navigation))

          # Check the exact backend origin is permitted by all site CSP policies.
          headers = (root / "_headers").read_text(encoding="utf-8")
          policies = [line for line in headers.splitlines() if "Content-Security-Policy:" in line]
          supabase_policies = [line for line in policies if "connect-src 'self' https://jaswikaaecfgqrxooubv.supabase.co;" in line]
          if len(policies) != 9 or len(supabase_policies) != 9:
              raise SystemExit("Supabase CSP allowance must be present in all nine policy entries.")

          print("Static checks passed: core routes, eight demos, five Forge workspaces, 220 glossary terms, six Insights articles, resource navigation, CSP and V71 asset caching.")
          PY
